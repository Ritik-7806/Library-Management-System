version: "3.9"

services:

  lms-backend:
    image: lms:latest
    container_name: lms-backend
    restart: always
    ports:
      - "9090:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: password

  mysql:
    image: mysql:8
    container_name: lms-mysql
    restart: always
    environment:
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: