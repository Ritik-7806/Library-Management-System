apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-inggress
  namespace: lms
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: lms.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lms-service
            port:
              number: 80